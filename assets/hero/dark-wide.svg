<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Dmitrii Borodulin — Fullstack engineer · design-grade frontend">
<title>Dmitrii Borodulin — Fullstack engineer · design-grade frontend</title>
<style>
.a{animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.tw{fill:#C9D4F0;animation-name:tw}.tw0{animation-duration:3.6s}.tw1{animation-duration:5.4s}.tw2{animation-duration:7.2s}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.2}}
.sh{fill:#D2DDFF;animation-name:sh;transform-box:fill-box;transform-origin:center}.sh0{animation-duration:3.2s}.sh1{animation-duration:4.4s}.sh2{animation-duration:5.6s}
@keyframes sh{0%,100%{transform:translateX(-3px) scaleX(.92)}50%{transform:translateX(3px) scaleX(1.06)}}
.bob{animation-name:bob;animation-duration:3.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
.line{animation-name:ln;animation-duration:3.2s;transform-box:fill-box;transform-origin:50% 0}
@keyframes ln{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
.rp{fill:none;stroke:#8396BC;stroke-width:.8;opacity:.3;animation-name:rp;animation-duration:3.9s;animation-timing-function:cubic-bezier(.2,.6,.3,1);transform-box:fill-box;transform-origin:center}
@keyframes rp{0%{transform:scale(.25);opacity:.75}100%{transform:scale(1.7);opacity:0}}
.fish{opacity:0;animation-name:fish;animation-duration:11s;animation-timing-function:linear}
@keyframes fish{0%,62%{transform:rotate(-62deg);opacity:0}62.5%{opacity:1}73%{transform:rotate(62deg);opacity:1}73.5%,100%{transform:rotate(62deg);opacity:0}}
.sp{fill:none;stroke:#8396BC;stroke-width:.9;opacity:0;animation-duration:11s;animation-timing-function:cubic-bezier(.2,.6,.3,1);transform-box:fill-box;transform-origin:center}
.sp-out{animation-name:sp-out}.sp-in{animation-name:sp-in}
@keyframes sp-out{0%,63%{transform:scale(.3);opacity:0}64%{opacity:.8}72%,100%{transform:scale(1.8);opacity:0}}
@keyframes sp-in{0%,72%{transform:scale(.3);opacity:0}73%{opacity:.8}82%,100%{transform:scale(2);opacity:0}}
.drift{animation-name:drift;animation-duration:28s;animation-direction:alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-70px)}}
.flap{animation-name:flap;animation-duration:.9s;transform-box:fill-box;transform-origin:center}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
.tg{font:400 22px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#AAB7D0;opacity:0;animation-name:tg;animation-duration:20s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
.tg.first{opacity:1}
@keyframes tg{0%{opacity:0;transform:translateY(6px)}2.25%{opacity:1;transform:translateY(0)}17.75%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
</style>
